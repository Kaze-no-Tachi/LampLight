# Single-institute self-host stack (PRD goal 5, acceptance P0-14).
#
#   cp .env.example .env      # set SELFHOST_DOMAIN, ACME_EMAIL, passwords
#   docker compose -f docker-compose.selfhost.yml up -d
#
# This is the degenerate case of the platform: one tenant row, one hostname,
# no Stripe Connect, no Cloudflare account, no platform dependency of any kind.
# Caddy obtains and renews a Let's Encrypt certificate for your one domain, so
# the whole custom-hostname subsystem is bypassed rather than stubbed.
#
# It differs from the production stack on purpose. Production uses Cloudflare
# Tunnel because Cloudflare for SaaS presents tenant hostnames in the TLS SNI
# and no origin can hold certificates for domains it does not control. A
# self-hoster serves one domain that they do control, so ordinary ACME works
# and the simpler setup is the correct one.

name: lamplight-selfhost

services:
  app:
    image: ${LAMPLIGHT_IMAGE:-ghcr.io/kaze-no-tachi/lamplight:latest}
    # Self-hosters building from a clone rather than pulling a published image
    # can uncomment this and drop the image line above.
    # build:
    #   context: .
    #   target: runner
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://lamplight_app:${POSTGRES_APP_PASSWORD}@postgres:5432/lamplight
      DATABASE_ADMIN_URL: postgres://lamplight_admin:${POSTGRES_ADMIN_PASSWORD}@postgres:5432/lamplight
      # One tenant, pinned. Host header resolution is skipped entirely.
      TENANCY_MODE: single
      SINGLE_TENANT_SLUG: ${SINGLE_TENANT_SLUG}
      PLATFORM_APEX_DOMAIN: ${SELFHOST_DOMAIN}
      TENANT_SUBDOMAIN_ROOT: ${SELFHOST_DOMAIN}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: https://${SELFHOST_DOMAIN}
      # Local object storage. Point at R2 or any S3-compatible service instead
      # if you would rather not keep media on this box.
      S3_ENDPOINT: http://minio:9000
      S3_REGION: auto
      S3_BUCKET: lamplight-media
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-lamplight_minio}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_FORCE_PATH_STYLE: 'true'
      # Charge on your own Stripe account, with no platform application fee.
      PAYMENTS_MODE: direct
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--quiet',
          '--tries=1',
          '--spider',
          'http://127.0.0.1:3000/api/health',
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  migrate:
    image: ${LAMPLIGHT_MIGRATOR_IMAGE:-ghcr.io/kaze-no-tachi/lamplight:latest-migrator}
    profiles: ['tools']
    restart: 'no'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://lamplight_app:${POSTGRES_APP_PASSWORD}@postgres:5432/lamplight
      DATABASE_ADMIN_URL: postgres://lamplight_admin:${POSTGRES_ADMIN_PASSWORD}@postgres:5432/lamplight
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lamplight_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: lamplight
      LAMPLIGHT_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lamplight_admin -d lamplight']
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lamplight_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: 'no'
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-lamplight_minio} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/lamplight-media &&
      echo 'bucket lamplight-media ready'
      "

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      SELFHOST_DOMAIN: ${SELFHOST_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
  caddy-data:
  caddy-config:
