# Production stack for the single VPS (see docs/adr/0004).
#
#   docker compose -f docker-compose.prod.yml up -d
#
# Deliberately absent:
#
#   Published ports. Nothing on this box listens on a public interface.
#   Cloudflare reaches the application through an outbound tunnel, so the
#   origin has no inbound attack surface and its IP is never exposed.
#
#   Minio. Lesson media lives in Cloudflare R2 in production. The only durable
#   state on this box is the Postgres volume, which is what the backup schedule
#   has to cover.
#
# This file is intended to be deployed by Dokploy using its "Docker Compose"
# service type, not "Stack". Stack mode deploys through Docker Swarm and drops
# support for build, depends_on conditions, and profiles, all three of which
# this file relies on.

name: lamplight

services:
  app:
    image: ${LAMPLIGHT_IMAGE:-ghcr.io/kaze-no-tachi/lamplight:latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Inside the compose network the database is reachable by service name.
      # These come from the Dokploy environment store, never from a file in the
      # repository.
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      TENANCY_MODE: platform
      PLATFORM_APEX_DOMAIN: ${PLATFORM_APEX_DOMAIN}
      TENANT_SUBDOMAIN_ROOT: ${TENANT_SUBDOMAIN_ROOT}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      SELF_SERVE_SIGNUP: ${SELF_SERVE_SIGNUP:-false}
      # MAIL IS NOT OPTIONAL IN PRODUCTION, AND THIS FILE USED TO OMIT IT.
      #
      # src/env.ts refuses to serve without SMTP_HOST and MAIL_FROM, because
      # account activation ends at a link sent to an address and an instance
      # that cannot send one accepts signups into a void. The stack as written
      # would therefore have failed to boot on its first deploy, with an error
      # about environment configuration rather than about mail.
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-auto}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      MAIL_FROM: ${MAIL_FROM}
      # Shared with the sweep service below. Unset means the endpoint 404s and
      # nothing periodic runs, which is a working site with domains that never
      # finish verifying.
      DOMAIN_SWEEP_SECRET: ${DOMAIN_SWEEP_SECRET}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID}
      CLOUDFLARE_SAAS_FALLBACK_ORIGIN: ${CLOUDFLARE_SAAS_FALLBACK_ORIGIN}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: 'false'
      SIGNED_URL_TTL_SECONDS: ${SIGNED_URL_TTL_SECONDS:-300}
      PAYMENTS_MODE: connect
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_CONNECT_CLIENT_ID: ${STRIPE_CONNECT_CLIENT_ID}
    depends_on:
      postgres:
        condition: service_healthy
      # The schema this release expects is applied before it serves a request.
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--quiet',
          '--tries=1',
          '--spider',
          'http://127.0.0.1:3000/api/health',
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # MIGRATIONS RUN AS PART OF `up`, AND FINISH BEFORE THE APP STARTS.
  #
  # This used to sit behind a `tools` profile, on the reasoning that two app
  # instances racing the migration table is how a schema gets corrupted. True,
  # and it does not apply here: this stack runs one replica, and the race it
  # guarded against needs two. What the profile bought instead was an ordering
  # rule that lived in the deploy tool's configuration rather than in this file,
  # so every deploy depended on somebody having set a pre-deploy hook correctly,
  # with the right project name, in a field they had to go and find. Getting it
  # wrong is silent: the app starts against an old schema, or compose starts a
  # second Postgres and migrates that one perfectly.
  #
  # So the ordering is stated here, where it cannot be forgotten, and `app`
  # waits for this to exit successfully. A failed migration now fails the deploy
  # rather than producing a running site on a schema it does not match.
  #
  # It stays runnable on its own for the operations that are not a deploy:
  #   docker compose -f docker-compose.prod.yml run --rm migrate
  #   docker compose -f docker-compose.prod.yml run --rm \
  #     migrate node_modules/.bin/tsx src/db/bootstrap-admin.ts you@example.com
  #
  # If this ever grows to more than one replica, the race comes back and the
  # ordering belongs in a release process again rather than in compose.
  migrate:
    image: ${LAMPLIGHT_MIGRATOR_IMAGE:-ghcr.io/kaze-no-tachi/lamplight:latest-migrator}
    restart: 'no'
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL}
      # Migrations do not need this. src/db/bootstrap-admin.ts does, because it
      # creates the first operator's account through Better Auth so the
      # password is hashed the way sign-in verifies it, and constructing Better
      # Auth requires the secret. Same image, same profile, one deliberate run.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-lamplight_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-lamplight}
      LAMPLIGHT_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Same role bootstrap the development stack and CI use. The application
      # role is created without BYPASSRLS, which is what makes the row-level
      # security layer real rather than decorative (see docs/adr/0002).
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_ADMIN_USER:-lamplight_admin} -d ${POSTGRES_DB:-lamplight}',
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  # THE THING THAT MAKES THE SWEEP ENDPOINT RUN.
  #
  # /api/platform/sweep has existed since phase 3 and nothing called it, so on
  # a real deployment a custom domain would sit unverified until an admin
  # happened to open the settings page, and expired invitations would never be
  # deleted. The endpoint was built to be driven by cron (ADR 0004); this is
  # the cron, kept in the stack so it is deployed and versioned with everything
  # else rather than living in somebody's crontab.
  #
  # A shell loop rather than a cron daemon: it is three lines, it logs to
  # `docker compose logs sweep` like every other service, and there is no
  # second place to look when it stops.
  sweep:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    environment:
      SWEEP_INTERVAL_SECONDS: ${SWEEP_INTERVAL_SECONDS:-900}
      DOMAIN_SWEEP_SECRET: ${DOMAIN_SWEEP_SECRET}
    volumes:
      - ./docker/sweep/run.sh:/run.sh:ro
    entrypoint: ['sh', '/run.sh']
    depends_on:
      app:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./docker/cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      # The tunnel credentials JSON produced by `cloudflared tunnel create`.
      # Lives on the VPS at /srv/lamplight/cloudflared, mode 600, never in git.
      - ${CLOUDFLARED_CREDENTIALS_DIR:-/srv/lamplight/cloudflared}:/etc/cloudflared/creds:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres-data:
