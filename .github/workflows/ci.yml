name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Mirrors the docker compose topology. The application role is separate from
  # the migration role and does not hold BYPASSRLS, so the isolation suite is
  # testing the same two-role setup that runs in production.
  DATABASE_URL: postgres://lamplight_app:lamplight_app_password@localhost:5432/lamplight
  DATABASE_ADMIN_URL: postgres://lamplight_admin:lamplight_admin_password@localhost:5432/lamplight
  LAMPLIGHT_APP_PASSWORD: lamplight_app_password
  # Matches the development stack, so a test that passes here is exercising
  # the same signing and key rules a developer sees locally.
  S3_ENDPOINT: http://localhost:9000
  S3_REGION: us-east-1
  S3_BUCKET: lamplight-media
  S3_ACCESS_KEY_ID: lamplight_minio
  S3_SECRET_ACCESS_KEY: lamplight_minio_password
  S3_FORCE_PATH_STYLE: 'true'

jobs:
  verify:
    runs-on: ubuntu-latest
    # The browser suite runs a production build and drives 51 tests through one
    # worker, and a failing test costs three attempts before it reports. Fifteen
    # minutes was enough while everything passed and cut the run off mid-report
    # the first time something did not, which hid the failures behind a
    # cancellation.
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lamplight_admin
          POSTGRES_PASSWORD: lamplight_admin_password
          POSTGRES_DB: lamplight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lamplight_admin -d lamplight"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Service containers cannot mount docker-entrypoint-initdb.d, so the same
      # role bootstrap the compose stack runs at init is applied here by hand.
      # One source of truth, two ways in.
      - name: Create the RLS-constrained application role
        run: psql "$DATABASE_ADMIN_URL" -v ON_ERROR_STOP=1 -f docker/postgres/init/01-roles.sql

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Check for em dashes
        run: pnpm exec tsx scripts/check-no-em-dash.ts

      # Object storage, so every suite that seeds has somewhere to put the
      # recordings. Started before the first seed rather than just before the
      # browser suite: the seed reports a failed upload and carries on, so a
      # bucket that appears later leaves rows pointing at objects that were
      # never written, and the player then fails on a fixture problem wearing
      # the costume of a product problem.
      #
      # Started from the development compose file rather than declared again as
      # a service container, so there is one definition of how Minio is
      # configured and CI cannot drift from what a developer runs. Postgres
      # stays a service container because it has to be up before any step runs.
      - name: Object storage
        run: |
          docker compose up -d minio minio-init
          docker compose logs minio-init

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Confirm the application role cannot bypass RLS
        # A guard on the guard. If this role ever gains BYPASSRLS or superuser,
        # every isolation assertion below becomes decorative while still
        # passing, so the suite would go green on a database with no isolation
        # at all.
        run: |
          psql "$DATABASE_URL" -tAc \
            "select rolsuper or rolbypassrls from pg_roles where rolname = current_user" \
            | grep -qx f

      - name: Unit and isolation tests
        run: pnpm test

      - name: Build
        # Deliberately built with no database configuration. A build must never
        # need runtime secrets, and this caught a real defect: a host-dependent
        # page was being prerendered, which required DATABASE_URL at build time
        # and would have served one institute's cached HTML to every institute.
        # It passed locally only because a .env happened to be present, and
        # failed in the container where none is.
        #
        # The grep is the second half of the same guard. Every route that reads
        # the Host header must be dynamic, marked ƒ in the build summary, since
        # a prerendered copy of any of them is a cross-tenant leak.
        env:
          DATABASE_URL: ''
          DATABASE_ADMIN_URL: ''
        run: |
          pnpm build 2>&1 | tee /tmp/build.log
          for route in /superadmin /platform-home; do
            grep -qE "ƒ ${route}\s" /tmp/build.log \
              || { echo "FAIL: ${route} is not dynamic, so it can be prerendered"; exit 1; }
          done
          grep -qE "ƒ /\s" /tmp/build.log \
            || { echo "FAIL: the tenant route / is not dynamic"; exit 1; }
          echo "all host-dependent routes are dynamic"

      - name: End to end tests
        # The auth boundary lives here rather than in the unit suite, because
        # "a session grants nothing at another institute" is only meaningful
        # against a real server handling real Host headers and real cookies.
        # These are the product's central security claims, so they gate merges.
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e

      - name: Validate every compose file
        # The three stacks drift apart easily, and a broken production compose
        # file is normally discovered during a deploy. Parsing them here is
        # nearly free. Placeholder values stand in for the real secrets, which
        # live in the Dokploy environment store.
        env:
          POSTGRES_ADMIN_PASSWORD: placeholder
          POSTGRES_APP_PASSWORD: placeholder
          MINIO_ROOT_PASSWORD: placeholder
          SELFHOST_DOMAIN: example.test
          ACME_EMAIL: ci@example.test
          SINGLE_TENANT_SLUG: example
        run: |
          for file in docker-compose.yml docker-compose.prod.yml docker-compose.selfhost.yml; do
            docker compose -f "$file" config > /dev/null
            echo "ok $file"
          done

  publish:
    # Only after verify is green. An image that failed the isolation suite must
    # never reach a registry a deploy could pull from.
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase the image name
        # GHCR rejects uppercase path segments, and this repository owner has
        # capitals in it.
        id: image
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push the application image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.repo }}:latest
            ghcr.io/${{ steps.image.outputs.repo }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the migrator image
        # Shipped separately so the runtime image carries no migration tooling
        # and no source. Migrations are run as a deliberate step against a
        # single instance, never from the application entrypoint.
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.repo }}:latest-migrator
            ghcr.io/${{ steps.image.outputs.repo }}:${{ github.sha }}-migrator
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy
        # Dokploy pulls and restarts. The webhook runs the migrator first as a
        # pre-deploy command, so a release that needs a schema change never
        # starts serving against the old schema. See docs/runbook.md.
        #
        # Fired from here rather than from a git webhook on Dokploy's side, and
        # the difference is not cosmetic. A push-triggered webhook fires while
        # this job is still building, so Dokploy would redeploy and pull the
        # PREVIOUS :latest, reporting success while shipping the last release.
        # This step runs after both images are published, so the tag it tells
        # Dokploy to pull is the one that was just built.
        #
        # A secret rather than a variable: the URL carries its own token, and
        # anybody holding it can trigger a production deploy. Mapped into env
        # first because the secrets context is not available in an `if`.
        env:
          HOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        if: env.HOOK != ''
        run: curl -fsS -X POST "$HOOK"
