name: lamplight

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # The compose superuser is the migration and superadmin role. The
      # RLS-constrained application role is created by the init script.
      POSTGRES_USER: lamplight_admin
      POSTGRES_PASSWORD: lamplight_admin_password
      POSTGRES_DB: lamplight
      LAMPLIGHT_APP_PASSWORD: lamplight_app_password
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lamplight_admin -d lamplight']
      interval: 3s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lamplight_minio
      MINIO_ROOT_PASSWORD: lamplight_minio_password
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: creates the media bucket so uploads work on a fresh volume.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 lamplight_minio lamplight_minio_password &&
      mc mb --ignore-existing local/lamplight-media &&
      echo 'bucket lamplight-media ready'
      "

volumes:
  postgres-data:
  minio-data:
